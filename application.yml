# Configuration partagée par TOUS les clients du Config Server
# (Eureka, Actuator, Zipkin / traçage distribué).
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0        # 100 % des requêtes tracées (développement)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Pas de base de données (interdit par le cahier des charges) :
# aucune propriété spring.datasource.* ; les données vivent en RAM
# (ConcurrentHashMap) et sont chargées par les DataSeeder au démarrage.
